<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Ravi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg: #f3f7f4;
    --surface: #ffffff;
    --surface-2: #eaf1ec;
    --ink: #1c2620;
    --ink-2: #5b6b60;
    --ink-3: #8b988f;
    --line: rgba(28,38,32,0.09);
    --accent: #3f7d69;
    --accent-soft: #e3f0e8;
    --coral: #d97a4f;
    --coral-soft: #fbe8dd;
    --formula: #4d7fb0;
    --peito: #c46f8c;
    --mix: #c9963a;
    --shadow: 0 1px 2px rgba(28,38,32,0.06), 0 8px 24px -12px rgba(28,38,32,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #10140f; --surface:#1a2119; --surface-2:#212a1f; --ink:#eef3ec; --ink-2:#aab6a4; --ink-3:#7c8778;
      --line: rgba(238,243,236,0.10); --accent:#6fb89a; --accent-soft:#1f3129;
      --coral:#e6a077; --coral-soft:#33241b; --formula:#7fa8d6; --peito:#dd97b1; --mix:#e0b25c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #10140f; --surface:#1a2119; --surface-2:#212a1f; --ink:#eef3ec; --ink-2:#aab6a4; --ink-3:#7c8778;
    --line: rgba(238,243,236,0.10); --accent:#6fb89a; --accent-soft:#1f3129;
    --coral:#e6a077; --coral-soft:#33241b; --formula:#7fa8d6; --peito:#dd97b1; --mix:#e0b25c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    margin:0; padding-inline:16px; padding-block:20px 48px; }
  h1,h2{ font-family:"Baloo 2","Inter",system-ui,sans-serif; margin:0; }
  .wrap{ max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  header{ display:flex; flex-direction:column; gap:4px; }
  .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  header h1{ font-size:28px; font-weight:800; }
  .header-meta{ font-size:13px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 14px; }
  .header-meta b{ color:var(--ink); font-weight:600; }
  .tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:640px){ .tiles{ grid-template-columns:repeat(4,1fr); } }
  .tile{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px;
    display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
  .tile .label{ font-size:12px; color:var(--ink-2); font-weight:600; }
  .tile .value{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  .tile .sub{ font-size:12px; color:var(--ink-3); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 18px 20px; box-shadow:var(--shadow); }
  .card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .card-head h2{ font-size:17px; font-weight:700; }
  .card-head .hint{ font-size:12px; color:var(--ink-3); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chart-scroll{ overflow-x:auto; margin:0 -4px; padding:0 4px; }
  svg.chart{ display:block; min-width:640px; width:100%; height:180px; }
  .bar-formula{ fill:var(--formula); } .bar-peito{ fill:var(--peito); } .bar-mix{ fill:var(--mix); }
  .axis-label{ font-size:9px; fill:var(--ink-3); font-family:"Inter",sans-serif; }
  .goal-line{ stroke:var(--ink-3); stroke-dasharray:3 3; stroke-width:1; }
  svg.growth{ display:block; width:100%; height:160px; }
  .growth-line{ fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .growth-dot{ fill:var(--accent); stroke:var(--surface); stroke-width:2; }
  .growth-label{ font-size:10px; fill:var(--ink-2); font-family:"Inter",sans-serif; font-variant-numeric:tabular-nums; }
  .meds-list{ display:flex; flex-direction:column; gap:8px; }
  .med-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--surface-2); }
  .med-swatch{ width:10px; height:10px; border-radius:50%; flex:none; }
  .med-name{ font-size:13.5px; font-weight:600; flex:1; min-width:120px; }
  .med-count{ font-size:12px; color:var(--ink-2); white-space:nowrap; }
  .med-next{ font-size:12px; font-weight:700; white-space:nowrap; padding:3px 9px; border-radius:999px; }
  .med-next.due{ background:var(--coral-soft); color:var(--coral); }
  .med-next.ok{ background:var(--accent-soft); color:var(--accent); }
  .med-next.none{ background:var(--surface); color:var(--ink-3); }
  .day-group{ display:flex; flex-direction:column; gap:8px; }
  .day-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 2px; }
  .day-head .d{ font-size:13px; font-weight:700; }
  .day-head .t{ font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .entry{ display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:12px; }
  .entry:nth-child(odd){ background:var(--surface-2); }
  .entry .time{ font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-2); width:40px; flex:none; padding-top:1px; }
  .entry .chip{ width:7px; height:7px; border-radius:50%; margin-top:5px; flex:none; }
  .entry .body{ flex:1; min-width:0; }
  .entry .main{ font-size:13.5px; font-weight:600; }
  .entry .obs{ font-size:12px; color:var(--ink-2); margin-top:1px; }
  .see-more{ margin-top:4px; align-self:flex-start; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .see-more:hover{ background:var(--surface-2); }
  footer{ font-size:11.5px; color:var(--ink-3); text-align:center; padding-top:6px; }
  .status{ font-size:12.5px; color:var(--ink-2); text-align:center; padding:40px 0; }
  .err{ color:var(--coral); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Diário do Ravi</div>
    <h1>Painel do Ravi</h1>
    <div class="header-meta">
      <span id="hAge"></span>
      <span id="hRange"></span>
      <span id="hUpdated"></span>
    </div>
  </header>

  <div id="loadingMsg" class="status">Carregando dados do Firebase…</div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:22px;">
    <div class="tiles" id="tiles"></div>

    <section class="card">
      <div class="card-head"><h2>Mamadas por dia</h2><div class="hint">últimos 21 dias · mL</div></div>
      <div class="legend" style="margin-bottom:10px;">
        <span><i class="dot" style="background:var(--formula)"></i>fórmula</span>
        <span><i class="dot" style="background:var(--peito)"></i>peito</span>
        <span><i class="dot" style="background:var(--mix)"></i>mix</span>
      </div>
      <div class="chart-scroll"><svg class="chart" id="feedChart" viewBox="0 0 640 180" preserveAspectRatio="none"></svg></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Crescimento</h2><div class="hint" id="growthHint"></div></div>
      <svg class="growth" id="growthChart" viewBox="0 0 640 160" preserveAspectRatio="none"></svg>
    </section>

    <section class="card">
      <div class="card-head"><h2>Medicações</h2><div class="hint">total de aplicações e próxima dose</div></div>
      <div class="meds-list" id="medsList"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Atividade recente</h2><div class="hint">mamadas e medicações</div></div>
      <div id="timeline"></div>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  "use strict";

  // ---- Firebase project config (public read per your database rules) ----
  const DB_URL = "https://diario-do-ravi-default-rtdb.firebaseio.com";
  const FAMILY_ID = "EHMJMH5F";
  const REFRESH_MS = 5 * 60 * 1000; // auto-refresh every 5 minutes

  const fmtInt = n => Math.round(n).toLocaleString("pt-BR");
  const pad2 = n => String(n).padStart(2,"0");
  const fmtDatePt = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}`; };
  const fmtDateFull = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
  const weekdayPt = iso => ["dom","seg","ter","qua","qui","sex","sáb"][new Date(iso+"T12:00:00").getDay()];

  async function load(){
    try{
      const res = await fetch(`${DB_URL}/families/${FAMILY_ID}.json`, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const fam = await res.json();
      if(!fam) throw new Error("Família não encontrada");
      render(fam);
      document.getElementById("loadingMsg").hidden = true;
      document.getElementById("app").hidden = false;
    }catch(err){
      document.getElementById("loadingMsg").innerHTML = `<span class="err">Não foi possível carregar os dados do Firebase agora (${err.message}). A página tenta de novo automaticamente.</span>`;
    }
  }

  function render(fam){
    const entriesObj = fam.entries || {};
    const entries = Object.values(entriesObj);
    const growthRaw = fam.growth || [];
    const growth = (Array.isArray(growthRaw) ? growthRaw : Object.values(growthRaw))
      .filter(g => g && g.weightKg != null)
      .sort((a,b)=> a.dateKey.localeCompare(b.dateKey));
    const medsCatalogRaw = fam.meds || [];
    const medsCatalog = Array.isArray(medsCatalogRaw) ? medsCatalogRaw : Object.values(medsCatalogRaw);
    const settings = fam.settings || {};
    const birthDate = settings.birthDate;

    // ---- daily aggregation ----
    const days = {};
    entries.forEach(e=>{
      if(!e || !e.dateKey) return;
      if(!days[e.dateKey]) days[e.dateKey] = {date:e.dateKey, ml:0, feeds:0, formula:0, peito:0, mix:0, meds:0};
      const d = days[e.dateKey];
      if(e.kind === "med"){ d.meds++; }
      else if(e.tipo){
        d.feeds++;
        d.ml += (e.ml||0);
        if(e.tipo in d) d[e.tipo]++;
      }
    });
    const daily = Object.values(days).sort((a,b)=> a.date.localeCompare(b.date));

    // ---- med stats ----
    const medById = {};
    medsCatalog.forEach(m=> medById[m.id]=m);
    const medStats = {};
    entries.forEach(e=>{
      if(!e || e.kind !== "med") return;
      const name = e.medName || "Outro";
      if(!medStats[name]) medStats[name] = {name, count:0, lastAt:null, color:"#8b6f47", intervalMin:null, maxPerDay:null};
      const ms = medStats[name];
      ms.count++;
      if(!ms.lastAt || e.createdAt > ms.lastAt) ms.lastAt = e.createdAt;
      const cat = medById[e.medId];
      if(cat){ ms.color = cat.color || ms.color; ms.intervalMin = cat.intervalMin; ms.maxPerDay = cat.maxPerDay; }
    });
    medsCatalog.forEach(m=>{
      if(!medStats[m.name]) medStats[m.name] = {name:m.name, count:0, lastAt:null, color:m.color, intervalMin:m.intervalMin, maxPerDay:m.maxPerDay};
    });
    const medList = Object.values(medStats).filter(m=>m.count>0).sort((a,b)=> new Date(b.lastAt||0) - new Date(a.lastAt||0));

    // ---- recent (last 80 by createdAt desc) ----
    const recent = entries.slice().sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,80);

    const now = new Date();

    // header
    if(birthDate){
      const birth = new Date(birthDate+"T00:00:00");
      const ageDaysTotal = Math.floor((now-birth)/86400000);
      const weeks = Math.floor(ageDaysTotal/7), restDays = ageDaysTotal%7;
      document.getElementById("hAge").innerHTML = `<b>${weeks} semanas e ${restDays} ${restDays===1?'dia':'dias'}</b> de vida`;
    }
    if(daily.length){
      document.getElementById("hRange").textContent = `Registros de ${fmtDateFull(daily[0].date)} a ${fmtDateFull(daily[daily.length-1].date)}`;
    }
    document.getElementById("hUpdated").textContent = `${entries.length} registros no total`;

    // tiles
    const today = daily[daily.length-1] || {ml:0,feeds:0};
    const last7 = daily.slice(-7);
    const avg7 = last7.length ? last7.reduce((s,d)=>s+d.ml,0)/last7.length : 0;
    const firstGrowth = growth[0], lastGrowth = growth[growth.length-1];
    const gainKg = (lastGrowth && firstGrowth) ? (lastGrowth.weightKg - firstGrowth.weightKg) : null;
    const lastFeed = recent.find(r=>r.tipo);
    const lastMed = recent.find(r=>r.kind==="med");

    function timeAgo(iso){
      const diffMin = Math.round((now - new Date(iso))/60000);
      if(diffMin < 1) return "agora";
      if(diffMin < 60) return `há ${diffMin} min`;
      const h = Math.floor(diffMin/60), m = diffMin%60;
      if(h < 24) return `há ${h}h${m?pad2(m)+'m':''}`;
      return `há ${Math.floor(h/24)}d`;
    }

    const tiles = [
      { label:"Hoje", value:`${fmtInt(today.ml)} mL`, sub:`${today.feeds} mamada${today.feeds===1?'':'s'} · média 7d ${fmtInt(avg7)} mL` },
      { label:"Última mamada", value: lastFeed? timeAgo(lastFeed.createdAt) : "—", sub: lastFeed? `${lastFeed.inicio||''} · ${lastFeed.tipo}${lastFeed.ml?` · ${lastFeed.ml}mL`:''}` : "" },
      { label:"Peso atual", value: lastGrowth? `${lastGrowth.weightKg.toFixed(3)} kg` : "—",
        sub: (lastGrowth && gainKg!=null) ? `+${gainKg.toFixed(3)} kg desde ${fmtDatePt(firstGrowth.dateKey)} · ${fmtDatePt(lastGrowth.dateKey)}` : "" },
      { label:"Última medicação", value: lastMed? timeAgo(lastMed.createdAt) : "—", sub: lastMed? lastMed.medName : "" },
    ];
    document.getElementById("tiles").innerHTML = tiles.map(t=>`
      <div class="tile"><div class="label">${t.label}</div><div class="value">${t.value}</div><div class="sub">${t.sub}</div></div>
    `).join("");

    // feeding chart
    (function(){
      const win = daily.slice(-21);
      if(!win.length){ document.getElementById("feedChart").innerHTML=""; return; }
      const W=640, H=180, padL=6, padR=6, padT=8, padB=18;
      const bw = (W-padL-padR)/win.length;
      const maxMl = Math.max(...win.map(d=>d.ml), 1) * 1.15;
      const scaleY = v => (H-padB) - (v/maxMl)*(H-padB-padT);
      let svg = "";
      const avgY = scaleY(avg7);
      svg += `<line class="goal-line" x1="${padL}" x2="${W-padR}" y1="${avgY}" y2="${avgY}"/>`;
      win.forEach((d,i)=>{
        const x = padL + i*bw + bw*0.16, w = bw*0.68;
        let yCursor = H-padB;
        const segs = [["formula", d.formula||0, "bar-formula"], ["mix", d.mix||0, "bar-mix"], ["peito", d.peito||0, "bar-peito"]];
        const totalCount = (d.formula||0)+(d.mix||0)+(d.peito||0) || 1;
        segs.forEach(([name,count,cls])=>{
          if(count<=0) return;
          const segMl = d.ml * (count/totalCount);
          const segH = (segMl/maxMl)*(H-padB-padT);
          yCursor -= segH;
          svg += `<rect class="${cls}" x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${w.toFixed(1)}" height="${segH.toFixed(1)}" rx="2"/>`;
        });
        if(i%2===0 || win.length<=14) svg += `<text class="axis-label" x="${(x+w/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${fmtDatePt(d.date)}</text>`;
      });
      document.getElementById("feedChart").innerHTML = svg;
    })();

    // growth chart
    (function(){
      if(growth.length < 2){ document.getElementById("growthChart").innerHTML=""; document.getElementById("growthHint").textContent=""; return; }
      const W=640,H=160,padL=34,padR=10,padT=14,padB=20;
      const minW = Math.min(...growth.map(g=>g.weightKg)), maxW = Math.max(...growth.map(g=>g.weightKg));
      const span = (maxW-minW)||1;
      const t0 = new Date(growth[0].dateKey).getTime(), t1 = new Date(growth[growth.length-1].dateKey).getTime();
      const scaleX = t => padL + ((new Date(t).getTime()-t0)/(t1-t0||1))*(W-padL-padR);
      const scaleY = v => (H-padB) - ((v-minW)/span)*(H-padB-padT-6) - 6;
      const pts = growth.map(g=>[scaleX(g.dateKey), scaleY(g.weightKg)]);
      let svg = `<path class="growth-line" d="M${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")}"/>`;
      growth.forEach((g,i)=>{
        const [x,y]=pts[i];
        svg += `<circle class="growth-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
        svg += `<text class="growth-label" x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle">${g.weightKg.toFixed(2)}kg</text>`;
        svg += `<text class="axis-label" x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle">${fmtDatePt(g.dateKey)}</text>`;
      });
      document.getElementById("growthChart").innerHTML = svg;
      document.getElementById("growthHint").textContent = `${minW.toFixed(2)}–${maxW.toFixed(2)} kg no período`;
    })();

    // meds
    document.getElementById("medsList").innerHTML = medList.map(m=>{
      let nextHtml = `<span class="med-next none">sem intervalo</span>`;
      if(m.intervalMin && m.lastAt){
        const nextAt = new Date(new Date(m.lastAt).getTime() + m.intervalMin*60000);
        const diffMin = Math.round((nextAt-now)/60000);
        if(diffMin<=0) nextHtml = `<span class="med-next due">dose atrasada</span>`;
        else { const h=Math.floor(diffMin/60), mi=diffMin%60; nextHtml = `<span class="med-next ok">em ${h?h+'h':''}${pad2(mi)}m</span>`; }
      }
      return `<div class="med-row">
        <span class="med-swatch" style="background:${m.color||'#8b6f47'}"></span>
        <span class="med-name">${m.name}</span>
        <span class="med-count">${m.count}x total</span>
        ${nextHtml}
      </div>`;
    }).join("") || `<div class="hint">Nenhuma medicação registrada.</div>`;

    // timeline grouped by day
    const byDay = [];
    let curDay=null, curList=null;
    recent.forEach(r=>{
      if(r.dateKey!==curDay){ curDay=r.dateKey; curList=[]; byDay.push([curDay,curList]); }
      curList.push(r);
    });
    function entryHtml(r){
      if(r.kind !== "med"){
        const colorVar = r.tipo==="formula"?"var(--formula)":r.tipo==="peito"?"var(--peito)":"var(--mix)";
        const label = r.tipo==="formula"?"Fórmula":r.tipo==="peito"?"Peito":"Mix";
        return `<div class="entry">
          <span class="time">${r.inicio||''}</span>
          <span class="chip" style="background:${colorVar}"></span>
          <span class="body">
            <div class="main">${label}${r.ml?` · ${r.ml}mL`:''}${r.termino?` <span style="color:var(--ink-3);font-weight:400;">(${r.inicio}–${r.termino})</span>`:''}</div>
            ${r.obs?`<div class="obs">${r.obs}</div>`:''}
          </span>
        </div>`;
      }
      return `<div class="entry">
        <span class="time">${r.inicio||''}</span>
        <span class="chip" style="background:var(--coral)"></span>
        <span class="body"><div class="main">${r.medName}</div></span>
      </div>`;
    }
    const DAYS_INITIAL = 5;
    function renderTimeline(count){
      const shown = byDay.slice(0,count);
      let html = shown.map(([dk,list])=>{
        const totalMl = list.filter(r=>r.tipo).reduce((s,r)=>s+(r.ml||0),0);
        return `<div class="day-group" style="margin-bottom:14px;">
          <div class="day-head"><span class="d">${weekdayPt(dk)}, ${fmtDateFull(dk)}</span><span class="t">${totalMl?fmtInt(totalMl)+' mL':''}</span></div>
          ${list.map(entryHtml).join("")}
        </div>`;
      }).join("");
      if(byDay.length>count) html += `<button class="see-more" id="seeMoreBtn">Ver mais dias</button>`;
      const el = document.getElementById("timeline");
      el.innerHTML = html || `<div class="hint">Sem registros.</div>`;
      const btn = document.getElementById("seeMoreBtn");
      if(btn) btn.addEventListener("click", ()=>renderTimeline(count+5));
    }
    renderTimeline(DAYS_INITIAL);

    document.getElementById("foot").textContent =
      `Dados ao vivo do Firebase (${FAMILY_ID}) · atualizado em ${now.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"medium"})} · atualiza sozinho a cada 5 min.`;
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
